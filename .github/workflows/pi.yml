name: Test Raspberry Pi detection and APIs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build shared pulse and radio parsers
        run: python tools/build_pi_native.py
      - name: Exercise transports, evidence, GPS and web APIs
        run: |
          python -m pip install Flask==3.1.3 pynmea2==1.19.0
          python -m unittest discover -s tests -p test_pi.py -v
          python -m compileall -q pi/flocknoir pi/config.py
          bash -n pi/install.sh pi/image/provision.sh pi/netmode.sh
